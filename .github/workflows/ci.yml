name: Client checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web-android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          cache: true
      - run: flutter pub get
      - run: python3 tool/generate_api.py api/openapi.json lib/api/generated.dart && dart format lib/api/generated.dart && git diff --exit-code -- lib/api/generated.dart
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --dart-define=PUBLIC_URL=https://qit.example.com
      - run: flutter build apk --release --dart-define=API_URL=https://qit.example.com/api/v1 --dart-define=PUBLIC_URL=https://qit.example.com
  ios:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign --dart-define=API_URL=https://qit.example.com/api/v1 --dart-define=PUBLIC_URL=https://qit.example.com
