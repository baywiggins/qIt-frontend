server {
    listen 8081;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Query strings can contain OAuth codes or connection tickets.
    access_log off;
    location = /ready { proxy_pass http://api:8080/ready; }
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location = /.well-known/apple-app-site-association { default_type application/json; }
    location = /.well-known/assetlinks.json { default_type application/json; }
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 360s;
        proxy_buffering off;
        # Never log single-use WebSocket tickets or OAuth callback codes.
        access_log off;
    }
    location / { try_files $uri $uri/ /index.html; }
    location = /index.html { add_header Cache-Control "no-cache"; }
}
