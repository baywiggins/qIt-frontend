name: qit
description: The party picks the music. Account-free song requests and voting.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.4
  supabase_flutter: ^2.10.3
  crypto: ^3.0.6
  http: ^1.5.0
  flutter_secure_storage: ^9.2.4
  qr_flutter: ^4.1.0
  web_socket_channel: ^3.0.3
  url_launcher: ^6.3.2
  flutter_web_plugins:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: Raleway
      fonts:
        - asset: fonts/Raleway-Regular.ttf
        - asset: fonts/Raleway-Bold.ttf
          weight: 700
